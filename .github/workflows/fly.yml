name: Fly Deploy
on:
  schedule:
    - cron: '0 19 * * *'   # 毎日 JST 4:00
  workflow_dispatch:
permissions:
  contents: read
  actions: write          # keepalive が使う
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group    # optional: ensure only one action runs at a time
    steps:
      - uses: actions/checkout@v4

      - name: Write fly.toml from repository variable
        run: echo "$FLY_TOML" > fly.toml
        env:
          FLY_TOML: ${{ vars.FLY_TOML }}

      - uses: superfly/flyctl-actions/setup-flyctl@master
      # upstream が master への push ごとにビルドする公式イメージをデプロイする
      - run: flyctl deploy --image ghcr.io/diygod/rsshub:latest
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # 60 日間リポジトリに動きがないと schedule が自動で止まるのを防ぐ
      - uses: gautamkrishnar/keepalive-workflow@v2
